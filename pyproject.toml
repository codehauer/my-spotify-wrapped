[project]
name = "my-spotify-wrapped"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=6.7.0",
    "plotly-express>=0.4.1",
]

[dependency-groups]
dev = [
    "pandas-stubs>=2.0.0",
    "pyright>=1.1.0",
]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
