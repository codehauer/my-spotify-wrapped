[project]
name = "my-spotify-wrapped"
version = "0.2.0"
description = "Your own Spotify Wrapped from your Spotify data export – in the terminal or the browser."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.3.3",
    "python-dateutil>=2.9",
    "textual>=6.11.0",
    "textual-serve>=1.1.3",
]

[project.scripts]
spotify-wrapped = "spotify_wrapped.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.3",
    "textual-dev>=1.8.0",
    "types-python-dateutil>=2.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_wrapped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
files = ["src"]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "textual_serve.*"]
ignore_missing_imports = true
